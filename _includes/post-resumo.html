<article class="h-entry{% include classe-tipo.html tipo=post.type %}">
    {% if post.type == nil %}
    <h2 class="p-name">
      <a href="{{ post.url | relative_url }}">{{ post.title | escape_once }}</a>
    </h2>
    {% endif %}

    <div class="e-content">
      {{ post.content }}
    </div>

    {% include data-post.html data=post.date url=post.url %}
  </article>
