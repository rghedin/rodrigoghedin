title: rodrigo.ghed.in
description: O jardim digital de Rodrigo Ghedin
url: "https://rodrigo.ghed.in"
author: Rodrigo Ghedin

# Identidade (h-card e rel=me). "perfis" são os seus perfis em outros sites.
email: rodrigo@ghed.in
perfis:
  - nome: Mastodon
    url: https://mastodon.social/@manualdousuario

excerpt_separator: "\n\n"

markdown: kramdown

pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title'
  sort_reverse: true

permalink: /blog/:slug
timezone: America/Sao_Paulo
future: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Índice do blog e páginas de filtro por tipo (pasta blog/)
  - scope:
      path: "blog"
      type: pages
    values:
      layout: blog

include:
  - _headers

exclude:
  - README.md
  - LICENSE.*

Blog: /blog/
